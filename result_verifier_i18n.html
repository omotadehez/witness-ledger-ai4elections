<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Result Verifier (synthetic demo)</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#14181f;--mu:#4f5967;--bd:#dfe4ea;--ok:#0a7d4a;--okb:#dcf4e7;--pe:#7a4f00;--peb:#fff0d1;--tm:#b3261e;--tmb:#fde3e1;--di:#6b3fa0;--dib:#eee3fa;--ac:#1a56db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#171b22;--tx:#e8ecf1;--mu:#a5afbd;--bd:#2a313b;--ok:#4ade80;--okb:#12301f;--pe:#fbbf24;--peb:#33280d;--tm:#ff8a80;--tmb:#3a1715;--di:#c4a1f5;--dib:#2a1d3d;--ac:#7aa2ff}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171b22;--tx:#e8ecf1;--mu:#a5afbd;--bd:#2a313b;--ok:#4ade80;--okb:#12301f;--pe:#fbbf24;--peb:#33280d;--tm:#ff8a80;--tmb:#3a1715;--di:#c4a1f5;--dib:#2a1d3d;--ac:#7aa2ff}
:root[data-hc="1"]{--bg:#fff;--card:#fff;--tx:#000;--mu:#000;--bd:#000;--ok:#004d25;--okb:#fff;--pe:#4d2e00;--peb:#fff;--tm:#8a0000;--tmb:#fff;--di:#3d1a75;--dib:#fff;--ac:#00339e}
:root[data-hc="1"] .card,:root[data-hc="1"] .stats div,:root[data-hc="1"] .badge{border:2px solid #000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.big{font-size:20px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:0 0 2px}h2{font-size:1rem;margin:0 0 8px}
.sub,.note{color:var(--mu);font-size:.85rem}.sub{margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin-top:8px}
.stats div{border-radius:10px;padding:8px 2px;font-size:.75rem}.stats b{display:block;font-size:1.2rem}
.VERIFIED{background:var(--okb);color:var(--ok)}.PENDING{background:var(--peb);color:var(--pe)}
.TAMPER{background:var(--tmb);color:var(--tm)}.DISPUTED{background:var(--dib);color:var(--di)}
.row{display:flex;gap:8px;margin-top:6px}
input[type=text],select{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
input[type=text]{flex:1;min-width:0}
button{font:inherit;padding:10px 14px;border-radius:10px;border:0;background:var(--ac);color:#fff}
button.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:8px 10px;font-size:.85rem}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
input[type=range]{width:100%}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:600}
code{font:.75rem ui-monospace,monospace;color:var(--mu);word-break:break-all}
table{width:100%;border-collapse:collapse;font-size:.85rem}
td,th{padding:5px 4px;border-bottom:1px solid var(--bd);text-align:left}
.wrap{overflow-x:auto}.bad{color:var(--tm);font-weight:600}.good{color:var(--ok)}
</style></head><body><main>
<div class="bar">
<select id="lg" aria-label="Language"><option value="en">English</option><option value="ha">Hausa</option><option value="yo">Yorùbá</option><option value="ig">Igbo</option><option value="pcm">Naijá (Pidgin)</option></select>
<button class="ghost" id="hc" aria-pressed="false" data-i="hc"></button>
<button class="ghost" id="ts" aria-pressed="false" data-i="ts"></button></div>
<h1 data-i="t"></h1>
<p class="sub" data-i="sub"></p>

<div class="card"><h2 data-i="rd"></h2>
<input type="range" id="rd" min="0" max="3" value="3" aria-labelledby="rdh">
<div class="stats" id="stats" aria-live="polite"></div>
<div class="note" style="margin-top:8px"><span data-i="rt"></span>: <code id="root">…</code></div></div>

<div class="card"><h2 id="rdh" data-i="chk"></h2>
<label for="q" class="note" data-i="lb"></label>
<div class="row"><input type="text" id="q" inputmode="numeric" placeholder="0-199"><button id="go" data-i="go"></button></div>
<div class="note" style="margin-top:8px" data-i="att"></div>
<div class="chips" id="chips"></div></div>

<div class="card" id="res" role="region" aria-live="polite" hidden></div>
<p class="note" data-i="lim"></p>
</main>
<script>
const D={
en:{t:"Result Verifier",sub:"Synthetic data only. Not connected to any real electoral system. This tool never declares or validates results; it flags mismatches for human review.",rd:"Sync round",rt:"Published root",chk:"Check a polling unit",lb:"Enter a number from 0 to 199",go:"Check",att:"Units needing attention:",none:"None",m1:"Matches witness quorum",m2:"Awaiting witnesses",m3:"Mismatch: refer to human review",m4:"Disputed: refer to human review",s1:"Match",s2:"Waiting",s3:"Mismatch",s4:"Disputed",th1:"Witness",th2:"Group",th3:"Copy vs published",nyr:"not yet received",mt:"matches",df:"differs",pf:"Public proof",ok:"Valid: this result is part of the published root.",bad:"Invalid: the altered result no longer matches the published root.",alt:"Simulate altering this result after publication",und:"Undo alteration",wc:"Witnesses",pu:"Published",g0:"Party A",g1:"Party B",g2:"Observers",hc:"High contrast",ts:"Larger text",lim:"Limits: this shows whether a published result was changed after upload and whether independent witnesses agree with it. It cannot prove the figures were right at the polling unit."},
ha:{t:"Mai Tabbatar da Sakamako",sub:"Bayanan gwaji ne kawai. Ba a haɗa da ainihin tsarin zaɓe ba. Wannan kayan aiki ba ya ayyana ko tabbatar da sakamako; yana nuna rashin daidaito ne don ɗan adam ya duba.",rd:"Zagayen daidaitawa",rt:"Tushen da aka buga",chk:"Duba rumfar zaɓe",lb:"Shigar da lamba daga 0 zuwa 199",go:"Duba",att:"Rumfunan da ke buƙatar kulawa:",none:"Babu",m1:"Ya yi daidai da shaidu masu rinjaye",m2:"Ana jiran shaidu",m3:"Rashin daidaito: a mika wa ɗan adam don dubawa",m4:"An samu sabani: a mika wa ɗan adam don dubawa",s1:"Daidai",s2:"Jira",s3:"Bambanci",s4:"Sabani",th1:"Shaida",th2:"Rukuni",th3:"Kwafi da wanda aka buga",nyr:"ba a karɓa ba tukuna",mt:"ya yi daidai",df:"ya bambanta",pf:"Hujjar jama’a",ok:"Mai inganci: wannan sakamakon yana cikin tushen da aka buga.",bad:"Ba shi da inganci: sakamakon da aka canza ba ya dacewa da tushen da aka buga.",alt:"Kwaikwayi canza wannan sakamakon bayan bugawa",und:"Warware canjin",wc:"Shaidu",pu:"Wanda aka buga",g0:"Jam’iyya A",g1:"Jam’iyya B",g2:"Masu sa ido",hc:"Bambanci mai ƙarfi",ts:"Babban rubutu",lim:"Iyakoki: wannan yana nuna ko an canza sakamakon da aka buga bayan lodawa, da ko shaidu masu zaman kansu sun amince da shi. Ba zai iya tabbatar da cewa alkaluman sun yi daidai a rumfar zaɓe ba."},
yo:{t:"Olùṣàyẹ̀wò Èsì",sub:"Dátà àyẹ̀wò nìkan ni. Kò so mọ́ ètò ìdìbò gidi kankan. Ohun èlò yìí kì í kéde tàbí fìdí èsì múlẹ̀; ó máa ń tọ́ka àìbáramu fún àyẹ̀wò ènìyàn.",rd:"Ìyípo ìmúdọ́gba",rt:"Gbòngbò tí a tẹ̀jáde",chk:"Ṣàyẹ̀wò ibùdó ìdìbò",lb:"Tẹ nọ́ńbà láti 0 sí 199",go:"Ṣàyẹ̀wò",att:"Àwọn ibùdó tó nílò àfiyèsí:",none:"Kò sí",m1:"Ó bá àpapọ̀ àwọn ẹlẹ́rìí mu",m2:"A ń dúró de àwọn ẹlẹ́rìí",m3:"Àìbáramu: fi ránṣẹ́ sí àyẹ̀wò ènìyàn",m4:"Àríyànjiyàn: fi ránṣẹ́ sí àyẹ̀wò ènìyàn",s1:"Báramu",s2:"Ń dúró",s3:"Àìbáramu",s4:"Àríyànjiyàn",th1:"Ẹlẹ́rìí",th2:"Ẹgbẹ́",th3:"Ẹ̀dà àti èyí tí a tẹ̀jáde",nyr:"kò tíì dé",mt:"ó bá mu",df:"ó yàtọ̀",pf:"Ẹ̀rí gbogbo ènìyàn",ok:"Tó tọ́: èsì yìí wà nínú gbòngbò tí a tẹ̀jáde.",bad:"Kò tọ́: èsì tí a yí padà kò bá gbòngbò tí a tẹ̀jáde mu mọ́.",alt:"Ṣe àfarawé yíyí èsì yìí padà lẹ́yìn títẹ̀jáde",und:"Fagilé àyípadà",wc:"Àwọn ẹlẹ́rìí",pu:"Èyí tí a tẹ̀jáde",g0:"Ẹgbẹ́ Olóṣèlú A",g1:"Ẹgbẹ́ Olóṣèlú B",g2:"Àwọn olùṣàkíyèsí",hc:"Ìyàtọ̀ àwọ̀ gíga",ts:"Ọ̀rọ̀ tó tóbi",lim:"Ààlà: èyí fihàn bóyá a yí èsì tí a tẹ̀jáde padà lẹ́yìn ìgbéwọlé àti bóyá àwọn ẹlẹ́rìí aláìgbáralé fohùn sí i. Kò lè fìdí rẹ̀ múlẹ̀ pé iye náà tọ́ ní ibùdó ìdìbò."},
ig:{t:"Onye Nyocha Nsonaazụ",sub:"Data nnwale naanị. Ejikọtaghị ya na usoro ntuli aka ọ bụla n’ezie. Ngwa a adịghị ekwupụta ma ọ bụ kwado nsonaazụ; ọ na-egosi ọdịiche ka mmadụ lelee.",rd:"Gburugburu nhazi",rt:"Mgbọrọgwụ e bipụtara",chk:"Lelee ụlọ ntuli aka",lb:"Tinye nọmba site na 0 ruo 199",go:"Lelee",att:"Ụlọ ntuli aka chọrọ nlebara anya:",none:"Ọ dịghị",m1:"Dakọtara na ọtụtụ ndị akaebe",m2:"A na-eche ndị akaebe",m3:"Adịghị adakọta: zipụ maka nyocha mmadụ",m4:"Esemokwu: zipụ maka nyocha mmadụ",s1:"Dakọtara",s2:"Na-echere",s3:"Adịghị adakọ",s4:"Esemokwu",th1:"Onye akaebe",th2:"Otu",th3:"Mkpụrụ edemede na nke e bipụtara",nyr:"anatabeghị",mt:"dakọtara",df:"dị iche",pf:"Ihe akaebe ọha",ok:"Ọ bụ eziokwu: nsonaazụ a bụ akụkụ nke mgbọrọgwụ e bipụtara.",bad:"Ọ bụghị eziokwu: nsonaazụ e gbanwere adakọtaghị na mgbọrọgwụ e bipụtara.",alt:"Gosi mgbanwe nsonaazụ a mgbe e bipụtachara",und:"Hichapụ mgbanwe",wc:"Ndị akaebe",pu:"Nke e bipụtara",g0:"Otu Pati A",g1:"Otu Pati B",g2:"Ndị nlekọta",hc:"Ọdịiche agba dị elu",ts:"Mkpụrụ okwu ukwu",lim:"Oke: nke a na-egosi ma e gbanwere nsonaazụ e bipụtara mgbe e bulitere ya na ma ndị akaebe nọọrọ onwe ha kwenyere na ya. Ọ nweghị ike ikwu na ọnụọgụ ndị ahụ ziri ezi n’ụlọ ntuli aka."},
pcm:{t:"Result Checker",sub:"Na test data only. E no connect to any real election system. Dis tool no dey announce or confirm result; e dey show wetin no match so person fit check am.",rd:"Sync round",rt:"Published root",chk:"Check one polling unit",lb:"Put number from 0 to 199",go:"Check am",att:"Units wey need attention:",none:"Nothing",m1:"E match wetin witnesses agree",m2:"We dey wait for witnesses",m3:"E no match: send am go human review",m4:"Dem dey argue am: send am go human review",s1:"Match",s2:"Wait",s3:"No match",s4:"Dispute",th1:"Witness",th2:"Group",th3:"Their copy vs wetin dem publish",nyr:"never reach",mt:"match",df:"no match",pf:"Public proof",ok:"E correct: dis result dey inside the published root.",bad:"E no correct: the result wey dem change no match the published root again.",alt:"Show wetin go happen if dem change dis result after dem publish am",und:"Cancel the change",wc:"Witnesses",pu:"Published",g0:"Party A",g1:"Party B",g2:"Observers",hc:"High contrast",ts:"Big text",lim:"Limit: dis one dey show if dem change published result after dem upload am, and if independent witnesses agree with am. E no fit prove say the figures correct for the polling unit."}};
let lang="en";const T=k=>D[lang][k];
const P=["P1","P2","P3","P4"],N=7,K=4,M=3,R=3,NU=200,IC={VERIFIED:"✔",PENDING:"…",TAMPER:"⚠",DISPUTED:"?"},LB={VERIFIED:"m1",PENDING:"m2",TAMPER:"m3",DISPUTED:"m4"},SH={VERIFIED:"s1",PENDING:"s2",TAMPER:"s3",DISPUTED:"s4"};
const $=id=>document.getElementById(id);
(async()=>{
const enc=new TextEncoder();
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",enc.encode(s)))].map(x=>x.toString(16).padStart(2,"0")).join("");
let seed=7;const rnd=()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const pick=a=>a[Math.floor(rnd()*a.length)];
const units=[];
for(let i=0;i<NU;i++){
  const id="PU-"+String(i).padStart(4,"0"),reg=300+Math.floor(rnd()*600),turn=Math.floor(reg*(.35+rnd()*.4));
  const w=P.map(()=>rnd()),tot=w.reduce((a,b)=>a+b);
  const sc=Object.fromEntries(P.map((p,j)=>[p,Math.floor(turn*w[j]/tot)])),isc={...sc};
  if(rnd()<.04)isc[pick(P)]+=20+Math.floor(rnd()*100);
  const can=s=>id+"|"+P.map(p=>p+":"+s[p]).join("|"),inecH=await sha(can(isc)),subs=[];
  for(let j=0;j<N;j++){const s={...sc};if(rnd()<.02)s[pick(P)]+=pick([-10,-1,1,10]);
    subs.push({w:"W"+(j+1),g:"g"+(j%3),h:await sha(can(s)),delay:rnd()<.15?1+Math.floor(rnd()*R):0})}
  units.push({id,sc,isc,inecH,subs});
}
const levels=[await Promise.all(units.map(u=>sha(u.id+"|"+u.inecH)))];
while(levels[levels.length-1].length>1){const L=levels[levels.length-1].slice();if(L.length%2)L.push(L[L.length-1]);
  const nx=[];for(let i=0;i<L.length;i+=2)nx.push(await sha(L[i]+L[i+1]));levels.push(nx)}
const root=levels[levels.length-1][0];
const proofOf=idx=>{const pr=[];for(let l=0;l<levels.length-1;l++){const L=levels[l],sib=idx^1;pr.push({sib:sib<L.length?L[sib]:L[idx],right:sib>idx});idx>>=1}return pr};
const check=async(leaf,pr)=>{let h=leaf;for(const s of pr)h=await sha(s.right?h+s.sib:s.sib+h);return h===root};
function status(u,r){
  const arr=u.subs.filter(s=>s.delay<=r),miss=N-arr.length,mine=arr.filter(s=>s.h===u.inecH);
  const mg=new Set(mine.map(s=>s.g)).size,cnt={};
  arr.forEach(s=>{if(s.h!==u.inecH)cnt[s.h]=(cnt[s.h]||0)+1});
  const rival=Math.max(0,...Object.values(cnt));
  if(mine.length>=K&&mg>=M)return rival>=K?"DISPUTED":"VERIFIED";
  if(rival>=K)return "TAMPER";
  if((mine.length+miss>=K&&mg+miss>=M)||rival+miss>=K)return "PENDING";
  return "DISPUTED";
}
let round=3,cur=null,altered=false;
$("root").textContent=root.slice(0,40)+"…";
function apply(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=T(e.dataset.i));
  summary();if(cur!==null)show(cur);
}
function summary(){
  const c={VERIFIED:0,PENDING:0,TAMPER:0,DISPUTED:0},flag=[];
  units.forEach((u,i)=>{const s=status(u,round);c[s]++;if(s==="TAMPER"||s==="DISPUTED")flag.push(i)});
  $("stats").innerHTML=Object.keys(c).map(k=>`<div class="${k}"><b>${c[k]}</b><span aria-hidden="true">${IC[k]}</span> ${T(SH[k])}</div>`).join("");
  $("chips").innerHTML=flag.length?flag.slice(0,12).map(i=>`<button class="ghost" data-i="${i}">${units[i].id}</button>`).join(""):`<span class="note">${T("none")}</span>`;
  $("rd").setAttribute("aria-valuetext","0-3: "+round);
}
async function show(i){
  cur=i;altered=false;const u=units[i],s=status(u,round),pr=proofOf(i),ok=await check(levels[0][i],pr);
  const rows=u.subs.map(x=>{const here=x.delay<=round,m=x.h===u.inecH;
    return `<tr><td>${x.w}</td><td>${T(x.g)}</td><td class="${!here?"":m?"good":"bad"}">${!here?T("nyr"):m?"✔ "+T("mt"):"✖ "+T("df")}</td></tr>`}).join("");
  const fig=s==="TAMPER"?`<p class="note">${T("wc")}: ${P.map(p=>p+" "+u.sc[p]).join(", ")}<br>${T("pu")}: ${P.map(p=>u.sc[p]!==u.isc[p]?`<span class="bad">${p} ${u.isc[p]} ⚠</span>`:p+" "+u.isc[p]).join(", ")}</p>`:"";
  const box=$("res");box.hidden=false;
  box.innerHTML=`<h2>${u.id}</h2><span class="badge ${s}"><span aria-hidden="true">${IC[s]}</span> ${T(LB[s])}</span>${fig}
  <p class="note">Hash: <code>${u.inecH.slice(0,32)}…</code></p>
  <div class="wrap"><table><tr><th>${T("th1")}</th><th>${T("th2")}</th><th>${T("th3")}</th></tr>${rows}</table></div>
  <h2 style="margin-top:12px">${T("pf")}</h2>
  <p id="pf" class="${ok?"good":"bad"}">${ok?"✔ "+T("ok"):"✖ "+T("bad")}</p>
  <button class="ghost" id="alt">${T("alt")}</button>`;
  $("alt").onclick=async()=>{
    altered=!altered;
    const v=await check(altered?await sha(u.id+"|"+u.inecH+"x"):levels[0][i],pr);
    $("pf").className=v?"good":"bad";$("pf").textContent=v?"✔ "+T("ok"):"✖ "+T("bad");
    $("alt").textContent=altered?T("und"):T("alt");
  };
}
const go=()=>{const n=parseInt($("q").value,10);if(n>=0&&n<NU)show(n);else{cur=null;$("res").hidden=false;$("res").textContent=T("lb")}};
$("go").onclick=go;$("q").onkeydown=e=>{if(e.key==="Enter")go()};
$("chips").onclick=e=>{const i=e.target.dataset.i;if(i!==undefined&&i!==""){$("q").value=i;show(+i)}};
$("rd").oninput=e=>{round=+e.target.value;summary();if(cur!==null)show(cur)};
$("lg").onchange=e=>{lang=e.target.value;apply()};
$("hc").onclick=e=>{const on=document.documentElement.dataset.hc!=="1";document.documentElement.dataset.hc=on?"1":"0";e.target.setAttribute("aria-pressed",on)};
$("ts").onclick=e=>{const on=document.body.classList.toggle("big");e.target.setAttribute("aria-pressed",on)};
apply();
})();
</script></body></html>
